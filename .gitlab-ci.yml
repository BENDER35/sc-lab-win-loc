stages:
  - mirror

variables:
  GIT_DEPTH: "0"

# No hacemos push desde CI a GitHub. Solo avisamos a GitHub Actions para que
# haga el pull del mirror usando GITHUB_TOKEN (eso no dispara más workflows).
mirror_to_github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      set -eu
      if [ -z "${GH_TOKEN:-}" ] || [ -z "${GITHUB_REPO:-}" ]; then
        echo "Faltan las variables GH_TOKEN o GITHUB_REPO" >&2
        exit 1
      fi
      payload=$(printf '{"event_type":"mirror-from-gitlab","client_payload":{"gitlab_sha":"%s"}}' "$CI_COMMIT_SHA")
      curl --fail --silent --show-error -X POST \
        -H "Authorization: Bearer ${GH_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -H "Content-Type: application/json" \
        -d "$payload" \
        "https://api.github.com/repos/${GITHUB_REPO}/dispatches"
      echo "Dispatch enviado a GitHub para sincronizar el mirror"
