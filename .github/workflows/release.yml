name: Release ZIP

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear ZIP
        run: ./scripts/release-zip.sh "${GITHUB_REF_NAME}"
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
