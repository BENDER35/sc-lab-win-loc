name: Mirror GitHub -> GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empujar refs a GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ] || [ -z "${GITLAB_REPO:-}" ]; then
            echo "Faltan el secret GITLAB_TOKEN o la variable GITLAB_REPO" >&2
            exit 1
          fi
          git config --global user.email "mirror@local"
          git config --global user.name "Mirror Bot"
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/mirror/*' '+refs/tags/*:refs/tags/*'
          url="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPO}.git"
          git push --quiet "$url" 'refs/remotes/mirror/*:refs/heads/*' 'refs/tags/*:refs/tags/*' --prune
          echo "Mirror GitHub -> GitLab completado"
